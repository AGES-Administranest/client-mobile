name: Sync to GitLab

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          GITLAB_REPO="tools.ages.pucrs.br/2026-2/2jk-4jk/administranest-gest-o-veterin-ria/frontend.git"
          git remote add gitlab "https://oauth2:${{ secrets.GITLAB_TOKEN }}@$GITLAB_REPO"
          git push gitlab ${{ github.ref_name }}
